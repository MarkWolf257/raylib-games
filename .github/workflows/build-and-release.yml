name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on {{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag_to_release || github.ref }}

      - name: Install dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install libasound2-dev libx11-dev libxrandr-dev libxi-dev libgl1-mesa-dev libglu1-mesa-dev libxcursor-dev libxinerama-dev libwayland-dev libxkbcommon-dev

      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Zip for ubuntu
        if: matrix.os == 'ubuntu-latest'
        run: tar -C ./build/bin -czpvf raylib-games-${{ matrix.os }}.tar.gz

      - name: Zip for windows
        if: matrix.os == 'windows-latest'
        run: Compress-Archive -Path .\build\bin\* -Destination .\raylib-games-${{ matrix.os }}.zip

      - name: Zip for macos
        if: matrix.os == 'macos-latest'
        run: tar -C ./build/bin -czpvf raylib-games-${{ matrix.os }}.tar.gz

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: ./raylib-games-${{ matrix.os }}.zip
  
  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: raylib-games-*
      
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            raylib-games-ubuntu.tar.gz
            raylib-games-windows.zip
            raylib-games-macos.tar.gz